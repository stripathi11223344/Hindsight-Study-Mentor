<!DOCTYPE html>
<html>
<head>
    <title>Study Mentor AI</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">

        <h1>Study Mentor AI</h1>

        <input
            type="text"
            id="username"
            placeholder="Enter your name"
        >

        <br><br>

        <div id="chat-box"></div>

        <input
            type="text"
            id="message"
            placeholder="Type your message..."
        >

        <button onclick="sendMessage()">
            Send
        </button>

    </div>

    <script src="script.js"></script>

</body>
</html>
